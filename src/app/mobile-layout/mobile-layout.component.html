<div class="wrapper" [ngClass]="{'darkMode': gameStateService.isDarkMode}">
    <mat-drawer-container class="drawer-container">
        <mat-drawer #drawer mode="over">
            <app-mobile-drawer />
        </mat-drawer>
        <mat-drawer-content class="drawer-content">
            <div class="app-bar">
                <button mat-icon-button (click)="drawer.toggle()">
                    <mat-icon>menu</mat-icon>
                </button>
                <div class="app-title">
                    <span>
                        Immortality Idle 2
                    </span>
                    <span class="versionNumber" (click)="commonButtonsService.changelogClicked()">v{{applicationVersion}}</span>
                </div>
            </div>
            <div class="main-part">
                @for (panelLayout of gameStateService.layout() ?? []; track panelLayout.id){
                    <app-mobile-panel-wrapper class="panelWrapper" [panelId]="panelLayout.id"/>
                }
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</div>
